# 访问日志带上 upstream 地址：多实例下「这条请求到底打到了哪个容器」
# 是排查转发问题的第一手信息，默认日志格式看不到。
log_format upstream_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             'upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstream_combined;

    # 变量形式的 proxy_pass（下面的 $api_upstream）需要运行时解析域名，必须
    # 显式配 resolver，否则每个 /api/ 请求都会 502（no resolver defined）。
    # 127.0.0.11 是 Docker 内嵌 DNS。换到非 Docker 环境时需相应调整。
    #
    # valid 只能缩短「用到旧地址」的窗口，消不掉它：Docker 会把停掉的容器的 IP
    # 回收给别的服务，窗口内解析到的旧地址可能已经属于另一个容器。真正的兜底是
    # compose 的网络隔离 —— frontend 只和 api 同在 edge 网络，worker/seeder 不在，
    # 所以 nginx 即使用到过期地址，也只可能打到某个 api 或自己（连不上 → 502），
    # 不会被 worker 冒充成 API：worker 同样监听 8080，但没有任何 Controller，
    # 会回 200 外壳的 "No static resource"，像是正常响应，极难排查。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Ticket QR page must not leak the referrer to third-party resources;
    # the app itself loads no third-party assets at all.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    # 统一入口：请求转发到 api 服务（compose 里可 --scale api=2，由 Nginx 的
    # DNS 轮询分配）。SSE 不缓存响应，心跳 25s < 读超时，连接不会被掐断。
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖而不是追加客户端自带的 XFF：客户端可以伪造前置条目绕过
        # Spring 侧按 XFF 做 IP 限流的逻辑。应用侧取最后一项，与本配置一致。
        proxy_set_header X-Forwarded-For $remote_addr;
        # SSE support: no buffering, no keepalive hop, long read timeout.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 同样用变量形式：写死的 proxy_pass 只在启动时解析一次并永久缓存，
    # api 重建后这个入口会一直打到旧地址，且不像 /api/ 那样有 TTL 兜底。
    location /actuator/ {
        set $actuator_upstream http://api:8080;
        proxy_pass $actuator_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
