server {
    listen 80;
    server_name _;

    # 变量形式的 proxy_pass（下面的 $api_upstream）需要运行时解析域名，必须
    # 显式配 resolver，否则每个 /api/ 请求都会 502（no resolver defined）。
    # 127.0.0.11 是 Docker 内嵌 DNS；valid 期间复用结果，api 容器重启或
    # --scale 扩缩容后最多 10s 内拿到新地址。换到非 Docker 环境时需相应调整。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Ticket QR page must not leak the referrer to third-party resources;
    # the app itself loads no third-party assets at all.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    # 统一入口：请求转发到 api 服务（compose 里可 --scale api=2，由 Nginx 的
    # DNS 轮询分配）。SSE 不缓存响应，心跳 25s < 读超时，连接不会被掐断。
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE support: no buffering, no keepalive hop, long read timeout.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /actuator/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
