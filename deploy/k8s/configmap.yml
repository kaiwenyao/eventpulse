# 普通配置（非敏感）：所有角色共享一套地址与运行参数。
apiVersion: v1
kind: ConfigMap
metadata:
  name: eventpulse-config
data:
  DB_URL: "jdbc:postgresql://postgres:5432/eventpulse"
  DB_USER: "eventpulse"
  KAFKA_BOOTSTRAP: "kafka:9092"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CORS_ORIGINS: "https://eventpulse.example.com"
  # 业务 Topic partition 数：多 Worker 分配消费；本地开发至少 3。
  KAFKA_PARTITIONS: "3"
  # SSE 心跳：20~30 秒，小于 Ingress 读超时。
  SSE_HEARTBEAT_MS: "25000"
  # Outbox 批量与领取租约。租约按条自动续期，OUTBOX_CLAIM_SECONDS 实际是
  # Worker 崩溃后其他 Worker 的接管延迟。
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_CLAIM_SECONDS: "60"
  LIFECYCLE_FIXED_DELAY_MS: "60000"
  # AI 网关：api 调 Python AI 服务（ClusterIP 内部地址，无公网入口）。
  AI_SERVICE_URL: "http://eventpulse-ai-service:8090"
  AI_ENABLED: "true"
  # Agent 多轮调用总耗时可能远超单次 HTTP 请求，读超时放长。
  AI_READ_TIMEOUT: "90000"
  # 图片对象存储（SeaweedFS 等 S3 兼容服务）。多副本部署必须启用；
  # 凭证 S3_ACCESS_KEY / S3_SECRET_KEY 在 Secret 中，不在这里。
  S3_ENABLED: "true"
  S3_ENDPOINT: "https://s3.kaiwen.dev"
  S3_REGION: "us-east-1"
  S3_BUCKET: "eventpulse"
  # SeaweedFS 走 path-style（https://endpoint/bucket/key）。
  S3_PATH_STYLE: "true"
