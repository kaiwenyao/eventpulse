# 敏感配置示例。复制为 secret.yml 并填入真实值；secret.yml 已被 .gitignore 排除
# （部署时用 kubectl create secret 或 sealed-secrets / external-secrets 管理更佳）。
# 注意：所有 API 实例必须使用同一个 SECRET_KEY，否则 JWT 在实例之间无法互认。
apiVersion: v1
kind: Secret
metadata:
  name: eventpulse-secret
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  SECRET_KEY: "change-me-32-bytes-minimum-secret!!"
