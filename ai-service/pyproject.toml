[project]
name = "eventpulse-ai-service"
version = "0.1.0"
description = "EventPulse Python AI Service — FastAPI + LangChain (copy assistant & event discovery agent)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval 标记的用例会真的调用外部 LLM，默认排除：CI 跑的是裸 `uv run pytest`
# （见 .github/workflows/ci.yml），不该花钱也不该需要真实 Key。
# 本地想跑：LLM_API_KEY=... uv run pytest -m eval
addopts = "-q -m 'not eval'"
markers = [
    "eval: 真实 LLM 回归集，opt-in（见 tests/evals/README.md）",
]
