name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits (GET /pulls/{n}/commits) and posts
    # review comments, so it needs pull-requests read+write — the global
    # `contents: read` alone makes the commits call 403.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build when secrets are found instead of only commenting.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # GitHub's dependency-review-action calls the Dependency Graph diff API
  # (GET /dependency-graph/compare), which is only available on public repos
  # or private repos with GitHub Advanced Security. This repo is a personal
  # private repo without GHAS, so that action hard-fails with 403 regardless
  # of permissions. Replaced with equivalent local checks that actually run:
  #   - frontend: npm audit (fail on high/critical)
  #   - backend:  mvn dependency:tree smoke (dependency graph is enforced by
  #               the lockfile / Spring Boot BOM; the diff gate is covered by
  #               npm audit above and package-lock.json review in PRs)
  dependency-check:
    name: Dependency check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend audit (npm)
        run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend dependency tree
        run: mvn -q -pl backend dependency:tree -Dscope=runtime -DoutputFile=/tmp/deps.txt && test -s /tmp/deps.txt

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit + Testcontainers integration tests
        run: mvn -B verify
      # Checkstyle（validate 阶段）与 SpotBugs（verify 阶段）由 backend/pom.xml 绑定进
      # 生命周期，上面的 mvn verify 同时跑静态分析门禁；失败时上传两份报告便于定位。
      - name: Upload static analysis reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            backend/target/checkstyle-result.xml
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore
      - name: Cleanup Testcontainers leftovers (Ryuk disabled)
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend
      - name: Whole SPA unit tests + coverage (Vitest, 80% thresholds)
        run: npm run coverage
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
      - name: Playwright browser smoke tests (no backend needed)
        run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend

  # Python AI 服务：模拟 LLM / 工具响应，不调用付费模型、不需要真实 Key。
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - name: Run pytest (scripted LLM, no real API key)
        run: |
          cd ai-service
          uv sync --extra dev
          uv run pytest

  deploy-config:
    name: Docker Compose & Kubernetes config validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test GitOps updates with local repositories
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Validate Kubernetes manifests
        run: |
          python3 - <<'PYEOF'
          import glob, sys
          import yaml
          allowed_kinds = {"ConfigMap", "Secret", "Deployment", "Service", "Ingress", "Job"}
          for path in sorted(glob.glob("deploy/k8s/**/*.yml", recursive=True)):
              docs = list(yaml.safe_load_all(open(path)))
              for doc in docs:
                  if not isinstance(doc, dict) or doc.get("kind") not in allowed_kinds:
                      sys.exit(f"invalid manifest: {path}")
              print(f"ok {path}")
          PYEOF
          # AI 服务绝不能出现在公网 Ingress 上
          if grep -q "ai-service" deploy/k8s/ingress.yml; then
            echo "ai-service must not be exposed via ingress"; exit 1
          fi
