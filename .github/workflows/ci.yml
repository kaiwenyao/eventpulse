name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build postgres test image (PG18 + PostGIS + pgvector, multi-arch)
        run: docker build -t eventpulse/postgres:18-3.6-pgvector deploy/postgres
      - name: Build, lint-less compile, unit + Testcontainers integration tests
        run: mvn -B verify
      - name: Upload backend SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/target/bom.json
      - name: Cleanup Testcontainers leftovers (Ryuk disabled)
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend
      - name: Whole SPA unit tests + coverage (Vitest, 80% thresholds)
        run: npm run coverage
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Generate frontend SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > frontend-sbom.cdx.json
        working-directory: frontend
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.cdx.json
      - name: Playwright browser smoke tests (no backend needed)
        run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend

  ml-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Lock, sync and test the offline evaluation pipeline
        # --frozen refuses to mutate uv.lock: CI must prove the checked-in
        # lock is what actually runs, so drift cannot silently change results.
        run: |
          uv sync --frozen
          uv run pytest -q
        working-directory: ml
