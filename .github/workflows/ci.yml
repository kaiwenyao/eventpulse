name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits (GET /pulls/{n}/commits) and posts
    # review comments, so it needs pull-requests read+write — the global
    # `contents: read` alone makes the commits call 403.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build when secrets are found instead of only commenting.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # GitHub's dependency-review-action calls the Dependency Graph diff API
  # (GET /dependency-graph/compare), which is only available on public repos
  # or private repos with GitHub Advanced Security. This repo is a personal
  # private repo without GHAS, so that action hard-fails with 403 regardless
  # of permissions. Replaced with equivalent local checks that actually run:
  #   - frontend: npm audit (fail on high/critical)
  #   - backend:  mvn dependency:tree smoke (dependency graph is enforced by
  #               the lockfile / Spring Boot BOM; the diff gate is covered by
  #               npm audit above and package-lock.json review in PRs)
  dependency-check:
    name: Dependency check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend audit (npm)
        run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend dependency tree
        run: mvn -q -pl backend dependency:tree -Dscope=runtime -DoutputFile=/tmp/deps.txt && test -s /tmp/deps.txt

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit + Testcontainers integration tests
        run: mvn -B verify
      - name: Upload backend SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/target/bom.json
      - name: Cleanup Testcontainers leftovers (Ryuk disabled)
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend
      - name: Whole SPA unit tests + coverage (Vitest, 80% thresholds)
        run: npm run coverage
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
      - name: Playwright browser smoke tests (no backend needed)
        run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
