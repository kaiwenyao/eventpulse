name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit + Testcontainers integration tests
        run: mvn -B verify
      - name: Upload backend SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/target/bom.json
      - name: Cleanup Testcontainers leftovers (Ryuk disabled)
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend
      - name: Whole SPA unit tests + coverage (Vitest, 80% thresholds)
        run: npm run coverage
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
      - name: Playwright browser smoke tests (no backend needed)
        run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
