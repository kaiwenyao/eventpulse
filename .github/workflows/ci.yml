name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build postgres test image (PG18 + PostGIS + pgvector, multi-arch)
        run: docker build -t eventpulse/postgres:18-3.6-pgvector deploy/postgres
      - name: Build, lint-less compile, unit + Testcontainers integration tests
        run: mvn -B test --file backend/pom.xml
      - name: Cleanup Testcontainers leftovers (Ryuk disabled)
        if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend

  ml-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Lock, sync and test the offline evaluation pipeline
        run: |
          uv lock
          uv sync
          uv run pytest -q
        working-directory: ml
