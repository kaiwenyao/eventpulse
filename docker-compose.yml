# EventPulse 分布式演示栈。同一个后端镜像通过 Spring Profile 运行三种角色：
#   api     只处理 HTTP 与 SSE（可 --scale api=2）
#   worker  消费 Kafka / 发送 Outbox / 活动生命周期（领取机制已就绪，可扩到多副本）
#   seeder  一次性初始化演示数据，完成后退出（等价于 Kubernetes Job）
# Single-node Kafka (KRaft) and Postgres are demo conveniences, not fault-tolerant
# production deployments.

x-backend-common: &backend-common
  image: eventpulse/backend:0.1.0
  # 默认只接内部网络；api 单独覆盖成 [backplane, edge]（见下面的 api 服务）。
  networks:
    - backplane
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/eventpulse
    DB_USER: eventpulse
    DB_PASSWORD: ${DB_PASSWORD:-eventpulse}
    KAFKA_BOOTSTRAP: kafka:9092
    REDIS_ENABLED: "true"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    SECRET_KEY: ${SECRET_KEY:-change-me-please-32-bytes-minimum-secret!!}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-25000}
    # AI 网关：Spring Boot 调 Python AI 服务，并用同一对服务间凭证互认。
    AI_SERVICE_URL: http://ai-service:8090
    AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-service-token}
    AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-dev-ai-internal-token}
    AI_ENABLED: ${AI_ENABLED:-true}
    # Agent 一轮可能包含多次 LLM 调用，读超时要覆盖全程（默认 90s）。
    AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-90000}

services:
  postgres:
    image: postgres:18-alpine
    networks:
      - backplane
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpulse}
    ports:
      - "5432:5432"
    # PostgreSQL 18 official image manages its data under /var/lib/postgresql
    # (keeps pg_upgrade possible across majors); do not mount .../data directly.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse -d eventpulse"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    networks:
      - backplane
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    networks:
      - backplane
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Dual listeners so the same broker works for:
      #   - compose services (PLAINTEXT → kafka:9092)
      #   - host-side local tests / `mvn spring-boot:run` (EXTERNAL → 127.0.0.1:9092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 多 Worker 时业务 Topic 的 partition 数下限（应用侧 KafkaTopicConfig 用同一个值）。
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # 一次性任务：等基础设施健康后播种演示数据，成功退出；失败由 Job 语义重跑。
  seeder:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: ../deploy/backend/Dockerfile
    command: ["--spring.profiles.active=seeder"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend-common
    command: ["--spring.profiles.active=api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    # 默认就起 2 个实例：这个项目的重点是分布式行为，单实例跑不出
    # SSE 跨实例送达、Nginx 轮询这些路径。--scale api=N 可临时覆盖。
    deploy:
      replicas: 2
    # api 是唯一同时在 edge 与 backplane 上的服务：frontend 只能看到它，
    # worker/seeder 不在 edge，所以 Nginx 即使用到回收后的旧 IP 也打不到 worker。
    networks:
      - backplane
      - edge
    # 不固定绑定宿主机端口：第二个 API 实例才起得来，统一入口由前端 Nginx 提供。
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  worker:
    <<: *backend-common
    command: ["--spring.profiles.active=worker"]
    # 默认 2 个实例：验证 Outbox 领取租约与 Kafka 分区再均衡。--scale worker=N 可覆盖。
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Python AI 服务：FastAPI + LangChain，独立镜像。
  # 只在 backplane 网络（api 可达），不经公网 Ingress / 前端反代暴露；
  # 浏览器只调 Spring Boot 的 /api/ai/**。LLM Key 只进这个容器。
  # 无状态（会话在 PostgreSQL），后续可 --scale ai-service=N。
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: eventpulse/ai-service:0.1.0
    networks:
      - backplane
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      BACKEND_INTERNAL_URL: http://api:8080
      BACKEND_SERVICE_TOKEN: ${AI_INTERNAL_TOKEN:-dev-ai-internal-token}
      SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-service-token}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: eventpulse/frontend:0.1.0
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # 对外入口网段：只有 frontend 和 api。Docker 会把停掉的容器 IP 回收给别的
  # 服务，Nginx 的 DNS 缓存窗口内可能用到已被回收的地址；把 worker/seeder
  # 挡在这个网络之外，最坏情况也只是打到某个 api 或连不上（502），
  # 不会被只有 Actuator 的 worker 冒充成 API 返回 "No static resource"。
  edge:
  # 内部网段：应用三角色 + Postgres / Redis / Kafka。
  backplane:

volumes:
  pgdata:
