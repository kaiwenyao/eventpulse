# EventPulse demo stack. Single-node Kafka (KRaft) / Redis / Postgres are demo
# conveniences, not fault-tolerant production deployments.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpulse}
    ports:
      - "5432:5432"
    # PostgreSQL 18 official image manages its data under /var/lib/postgresql
    # (keeps pg_upgrade possible across majors); do not mount .../data directly.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse -d eventpulse"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Dual listeners so the same broker works for:
      #   - compose services (PLAINTEXT → kafka:9092)
      #   - host-side local tests / `mvn spring-boot:run` (EXTERNAL → 127.0.0.1:9092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/backend/Dockerfile
    image: eventpulse/backend:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/eventpulse
      DB_USER: eventpulse
      DB_PASSWORD: ${DB_PASSWORD:-eventpulse}
      KAFKA_BOOTSTRAP: kafka:9092
      SECRET_KEY: ${SECRET_KEY:-change-me-please-32-bytes-minimum-secret!!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: eventpulse/frontend:0.1.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
