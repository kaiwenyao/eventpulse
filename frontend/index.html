<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventPulse · 活动预订</title>
    <meta name="theme-color" content="#201e1d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)" />
    <!-- Apply the persisted/system theme before paint so there is no flash of
         the wrong scheme on load. Reads localStorage first, falls back to the
         OS preference, and defaults to light — the design system's ground. -->
    <script>
      ;(function () {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        var l = localStorage.getItem('locale')
        if (l === 'en' || l === 'zh') {
          document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
