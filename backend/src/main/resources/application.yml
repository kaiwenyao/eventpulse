spring:
  application:
    name: eventpulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpulse}
    username: ${DB_USER:eventpulse}
    password: ${DB_PASSWORD:eventpulse}
    hikari:
      maximum-pool-size: ${TX_POOL_SIZE:20}
      pool-name: tx-pool
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 60000
      transaction-id-prefix: ${KAFKA_TX_PREFIX:}   # empty by default: idempotent producer, non-transactional relay
    consumer:
      group-id: ${KAFKA_GROUP_ID:eventpulse-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] [%X{traceId:-}] [%X{module:-}] %logger{36} - %msg%n"
  level:
    dev.kaiwen.eventpulse: INFO

eventpulse:
  security:
    secret-key: ${SECRET_KEY:dev-only-secret-key-change-me-0123456789abcdef}
    token-pepper: ${TOKEN_PEPPER:dev-only-pepper-change-me-0123456789abcdef}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    admin-reauth-ttl: PT10M
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  booking:
    ttl: PT15M
    max-per-booking: 10
    expiry-scan-interval: PT1S
  commands:
    dispatcher-interval: PT0.5S
    batch-size: 20
    lease: PT30S
    max-attempts: 8
  relay:
    interval: PT0.5S
    batch-size: 200
  gateway:
    # Demo-only scenario rules, matched by provider-key prefix.
    # In 'prod' profile a non-empty user-controllable rule set fails startup (see GatewayConfig assertion).
    scenario-rules-spec: ${GATEWAY_SCENARIO_RULES:}
    unknown-resolve-interval: PT5S
  rate-limit:
    login: 10/60
    register: 5/60
    redeem: 60/60
    interactions: 30/60
    reauth: 5/60

---
spring:
  config:
    activate:
      on-profile: demo
  kafka:
    listener:
      auto-startup: true

eventpulse:
  seed:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

eventpulse:
  security:
    secret-key: ${SECRET_KEY:}
    token-pepper: ${TOKEN_PEPPER:}
