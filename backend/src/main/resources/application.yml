spring:
  application:
    name: eventpulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpulse}
    username: ${DB_USER:eventpulse}
    password: ${DB_PASSWORD:eventpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: eventpulse
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

eventpulse:
  secret-key: ${SECRET_KEY:dev-only-secret-key-change-me-0123456789ab}
  token-ttl-ms: 604800000
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  media-dir: ${MEDIA_DIR:data/media}
  redis-enabled: ${REDIS_ENABLED:false}
  redis-host: ${REDIS_HOST:localhost}
  redis-port: ${REDIS_PORT:6379}
  outbox:
    future-wait-seconds: 12

---
spring:
  config:
    activate:
      on-profile: demo

eventpulse:
  redis-enabled: ${REDIS_ENABLED:true}
  redis-host: ${REDIS_HOST:redis}
