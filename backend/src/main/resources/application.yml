spring:
  application:
    name: eventpulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpulse}
    username: ${DB_USER:eventpulse}
    password: ${DB_PASSWORD:eventpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: eventpulse
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  task:
    scheduling:
      pool:
        size: 2
  lifecycle:
    # Graceful shutdown: finish in-flight requests and let SSE clients reconnect.
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

# 过程日志走 SLF4J：HTTP 拦截器打请求，Hibernate 打 SQL 语句。
# 控制台带 requestId，方便把一次请求和它触发的 SQL 对上。
# 不默认打开 jdbc.bind TRACE：绑定值会把邮箱等写进日志。
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    # SQL 过程日志默认开；生产嫌吵可用 SQL_LOG_LEVEL=WARN 压掉。
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

eventpulse:
  secret-key: ${SECRET_KEY:dev-only-secret-key-change-me-0123456789ab}
  token-ttl-ms: 604800000
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  # 本地磁盘目录：仅 s3.enabled=false（默认，本地开发）时使用；
  # 也是历史本地图片的迁移来源（见 README「图片存储」）。
  media-dir: ${MEDIA_DIR:data/media}
  redis-enabled: ${REDIS_ENABLED:false}
  redis-host: ${REDIS_HOST:localhost}
  redis-port: ${REDIS_PORT:6379}
  seed-name: demo-v1
  s3:
    # 图片对象存储（SeaweedFS 等 S3 兼容服务）。多副本部署必须 enabled=true，
    # 否则 api 副本之间看不到彼此上传的文件。凭证只经环境变量 / Secret 注入。
    enabled: ${S3_ENABLED:false}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    # 运行时只使用已有 bucket，不会创建，也不会改公开权限。
    bucket: ${S3_BUCKET:eventpulse}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # SeaweedFS 走 path-style（https://endpoint/bucket/key）。
    path-style: ${S3_PATH_STYLE:true}
    # 图片的浏览器直连基址，例如 https://s3.kaiwen.dev/eventpulse。仅当 bucket
    # 已授予匿名 s3:GetObject（对象级，不含 ListBucket）时才配；留空则图片继续
    # 走 /api/media/images/{id} 代理。应用不检查也不修改这个权限。
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    connect-timeout-ms: ${S3_CONNECT_TIMEOUT:2000}
    read-timeout-ms: ${S3_READ_TIMEOUT:10000}
    api-call-timeout-ms: ${S3_API_CALL_TIMEOUT:30000}
  media:
    # 软删除图片的对象清理（worker 执行）：宽限期后删除 S3 对象并标记 PURGED。
    purge-enabled: ${MEDIA_PURGE_ENABLED:true}
    purge-after-days: ${MEDIA_PURGE_AFTER_DAYS:7}
    purge-batch-size: ${MEDIA_PURGE_BATCH_SIZE:50}
    purge-fixed-delay-ms: ${MEDIA_PURGE_FIXED_DELAY_MS:3600000}
    purge-initial-delay-ms: ${MEDIA_PURGE_INITIAL_DELAY_MS:60000}
  ai:
    enabled: ${AI_ENABLED:true}
    service-url: ${AI_SERVICE_URL:http://localhost:8090}
    service-token: ${AI_SERVICE_TOKEN:dev-ai-service-token}
    internal-token: ${AI_INTERNAL_TOKEN:dev-ai-internal-token}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT:2000}
    read-timeout-ms: ${AI_READ_TIMEOUT:90000}
    # 文案助手单独一条读超时：它只有一次受 LLM_TIMEOUT_SECONDS 约束的调用，
    # 跟发现助手共用 90s 只会让 Tomcat 线程白占。
    read-timeout-improve-ms: ${AI_READ_TIMEOUT_IMPROVE:35000}
    # 连续多少次「传输层」故障后熔断（0 = 关闭）。应用层 502（模型没吐好）不计入。
    breaker-failure-threshold: ${AI_BREAKER_FAILURE_THRESHOLD:5}
    breaker-open-seconds: ${AI_BREAKER_OPEN_SECONDS:30}
    rate-limit-user-per-minute: ${AI_RATE_LIMIT_USER:10}
    rate-limit-ip-per-minute: ${AI_RATE_LIMIT_IP:30}
    max-message-chars: 1000
    max-events: 10
    history-limit: 8
    context-token-ttl-seconds: 300
    time-zone: ${AI_TIME_ZONE:Europe/Berlin}
    # 每日 token 预算（0 = 关闭）。限流挡短时间刷调用，预算挡长尾的成本失控。
    # 语义是「先检查、后记账」，跨过阈值的那一次仍会放行并小幅超支。
    daily-token-budget-user: ${AI_DAILY_TOKEN_BUDGET_USER:200000}
    daily-token-budget-global: ${AI_DAILY_TOKEN_BUDGET_GLOBAL:0}
    # 上游失败时按这个值记账：失败的那一轮真的烧了 token，但 502 里没有 usage。
    failure-token-penalty: ${AI_FAILURE_TOKEN_PENALTY:2000}
    # AI 结果缓存。没有 Redis 时无论如何都不缓存（直接回源真调一次 LLM）。
    # 换模型后最多 cache-improve-ttl-seconds 内仍可能返回旧模型的文案。
    cache-enabled: ${AI_CACHE_ENABLED:true}
    cache-improve-ttl-seconds: ${AI_CACHE_IMPROVE_TTL_SECONDS:3600}
    cache-discovery-ttl-seconds: ${AI_CACHE_DISCOVERY_TTL_SECONDS:120}
    # 会话与调用日志的保留期（天，0 = 不清理），由 worker 分批删除。
    retention-days: ${AI_RETENTION_DAYS:90}
    request-log-retention-days: ${AI_REQUEST_LOG_RETENTION_DAYS:180}
    retention-batch-size: ${AI_RETENTION_BATCH_SIZE:200}
    conversation-list-limit: ${AI_CONVERSATION_LIST_LIMIT:20}
    conversation-message-limit: ${AI_CONVERSATION_MESSAGE_LIMIT:50}
